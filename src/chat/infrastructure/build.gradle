dependencies {
    implementation project(':chat-domain')
    implementation project(':chat-application')
    implementation project(':common-jpa')
    // 상대 회원 요약 · 차단 · 이용 제한을 user 계약(MemberSummaryQuery · BlockRelationQuery · MemberRestrictionQuery)으로 조회한다
    implementation project(':user-application')
    // 다른 교환 완료 · 약속 상태를 exchange 계약(ChatRoomExchangeQuery)으로 조회한다
    implementation project(':exchange-application')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // DB 연동 테스트 (PostgreSQL 컨테이너 · Flyway 마이그레이션)
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}
