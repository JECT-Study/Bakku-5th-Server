# staging: 미니 PC (dev와 DB 분리). DB_URL, DB_USERNAME, DB_PASSWORD, SPRING_ELASTICSEARCH_URIS는 환경 변수로 주입한다.
# 공통 설정(application.yml)과 다른 값이 필요할 때 여기에 추가한다.

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: bakku
        environment: staging

management:
  server:
    port: 19080
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        add-additional-paths: true
  metrics:
    tags:
      env: staging
