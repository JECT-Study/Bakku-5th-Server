spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  terms:
    # 약관 본문 웹뷰 주소 앞부분. 도메인이 정해지면 바꾼다
    document-base-url: "https://{도메인}"
  auth:
    jwt:
      # HS256 서명 키, 32바이트 이상. staging · 운영은 기본값이 없어 반드시 환경변수로 넣는다
      secret: ${JWT_SECRET}
      access-token-validity: PT1H
    # 소셜 회원번호 HMAC 키, 32바이트 이상. 바꾸면 기존 회원을 찾지 못하므로 한 번 정하면 유지한다
    social-id-hash-secret: ${SOCIAL_ID_HASH_SECRET}
    kakao:
      # 카카오 디벨로퍼스 앱 ID(숫자). 비우면 토큰의 발급 앱을 확인하지 않는다
      app-id: ${KAKAO_APP_ID:}
    # 로그인 없이 부르는 /api/ 경로 (Ant 패턴). 그 밖의 /api/ 경로는 Authorization: Bearer 토큰이 필요하다
    public-paths:
      - /api/v1/auth/*/login
      - /api/v1/auth/signup
      - /api/v1/auth/token/refresh
      - /api/v1/members/nickname-availability
      - /api/v1/terms
      - /api/v1/app/version
      - /api/v1/dev/**

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: bakku
    distribution:
      percentiles-histogram:
        http.server.requests: true
