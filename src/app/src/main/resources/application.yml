spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  version:
    # 앱 최소 지원 버전 · 스토어 주소 (AP-1). 이보다 낮은 앱은 강제 업데이트. 배포 없이 환경변수로 바꾼다
    ios:
      minimum-version: ${APP_IOS_MINIMUM_VERSION:1.0.0}
      store-url: ${APP_IOS_STORE_URL:https://apps.apple.com/app/id0000000000}
    android:
      minimum-version: ${APP_ANDROID_MINIMUM_VERSION:1.0.0}
      store-url: ${APP_ANDROID_STORE_URL:https://play.google.com/store/apps/details?id=com.bakku.app}
  terms:
    # 약관 본문 웹뷰 주소 앞부분. 도메인이 정해지면 환경마다 TERMS_DOCUMENT_BASE_URL로 넣는다
    document-base-url: ${TERMS_DOCUMENT_BASE_URL:https://{도메인}}
  auth:
    jwt:
      # HS256 서명 키, 32바이트 이상. staging · 운영은 기본값이 없어 반드시 환경변수로 넣는다
      secret: ${JWT_SECRET}
      access-token-validity: PT1H
      # 가입 도중 앱을 꺼도 이어서 가입할 수 있게 7일 (결정 A2-1)
      signup-token-validity: P7D
    # 소셜 회원번호 HMAC 키, 32바이트 이상. 바꾸면 기존 회원을 찾지 못하므로 한 번 정하면 유지한다
    social-id-hash-secret: ${SOCIAL_ID_HASH_SECRET}
    kakao:
      # 카카오 디벨로퍼스 앱 ID(숫자, 공개 값). 다른 앱에서 발급된 토큰을 막는다. 비우면 확인하지 않는다
      app-id: ${KAKAO_APP_ID:1624939}
    # 로그인 없이 부르는 /api/ 경로 (Ant 패턴). 그 밖의 /api/ 경로는 Authorization: Bearer 토큰이 필요하다
    public-paths:
      - /api/v1/auth/*/login
      - /api/v1/auth/signup
      - /api/v1/auth/token/refresh
      - /api/v1/members/nickname-availability
      - /api/v1/terms
      - /api/v1/app/version
      - /api/v1/dev/**
  image:
    base-url: ${IMAGE_BASE_URL:http://localhost:8080}
    cache-max-age: ${IMAGE_CACHE_MAX_AGE:1d}
    storage:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:garage}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

server:
  shutdown: graceful
  # 프록시 뒤에서 클라이언트 IP · 스킴을 X-Forwarded-* 로 복원한다. Tomcat은 X-Forwarded-For를 오른쪽부터 읽어
  # 내부 프록시(사설 · 루프백 대역, server.tomcat.remoteip.internal-proxies 기본값)를 건너뛴 첫 주소를 쓴다
  forward-headers-strategy: native
  tomcat:
    max-swallow-size: 60MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: bakku
    distribution:
      percentiles-histogram:
        http.server.requests: true
