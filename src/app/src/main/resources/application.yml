spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  time-zone: ${APP_TIME_ZONE:Asia/Seoul}
  auth:
    jwt:
      # HS256 서명 키, 32바이트 이상. staging · 운영은 기본값이 없어 반드시 환경변수로 넣는다
      secret: ${JWT_SECRET}
      access-token-validity: PT1H
    # 로그인 없이 부르는 /api/ 경로 (Ant 패턴). 그 밖의 /api/ 경로는 Authorization: Bearer 토큰이 필요하다
    public-paths:
      - /api/v1/auth/*/login
      - /api/v1/auth/signup
      - /api/v1/auth/token/refresh
      - /api/v1/members/nickname-availability
      - /api/v1/terms
      - /api/v1/app/version
      - /api/v1/dev/**

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: bakku
    distribution:
      percentiles-histogram:
        http.server.requests: true
