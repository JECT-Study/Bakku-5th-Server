logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: bakku
        environment: dev

management:
  # actuator는 Ingress로 공개되지 않는 별도 포트에서만 연다 (Prometheus는 클러스터 내부에서 이 포트로 수집)
  server:
    port: 19080
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        add-additional-paths: true
  metrics:
    tags:
      env: dev
