app:
  auth:
    jwt:
      # 로컬 · dev 전용 기본 키. 공개되어 있으므로 staging · 운영에서는 쓰지 않는다
      secret: ${JWT_SECRET:bakku-local-dev-only-jwt-secret-key-0001}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: bakku
        environment: dev

management:
  # actuator는 Ingress로 공개되지 않는 별도 포트에서만 연다 (Prometheus는 클러스터 내부에서 이 포트로 수집)
  server:
    port: 19080
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        add-additional-paths: true
  metrics:
    tags:
      env: dev
