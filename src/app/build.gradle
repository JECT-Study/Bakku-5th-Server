plugins {
    id 'org.springframework.boot'
}

// 실행 가능한 bootJar만 생성한다 (plain jar가 함께 생기면 Docker 이미지에 jar를 복사할 때 대상이 둘이 됨)
tasks.named('jar') {
    enabled = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation project(':chat-api')
    runtimeOnly project(':chat-infrastructure')
    implementation project(':exchange-api')
    runtimeOnly project(':exchange-infrastructure')
    implementation project(':notification-api')
    runtimeOnly project(':notification-infrastructure')
    implementation project(':post-api')
    runtimeOnly project(':post-infrastructure')
    implementation project(':reputation-api')
    runtimeOnly project(':reputation-infrastructure')
    implementation project(':user-api')
    runtimeOnly project(':user-infrastructure')
    implementation project(':example-api')
    runtimeOnly project(':example-infrastructure')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
