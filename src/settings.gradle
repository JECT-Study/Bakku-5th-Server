rootProject.name = 'bakku-5th-server'

include 'app'

def commons = ['core', 'web', 'jpa', 'event']
def domains = ['chat', 'exchange', 'notification', 'post', 'reputation', 'user', 'example']
def layers = ['api', 'application', 'domain', 'infrastructure']

domains.each { domain ->
    layers.each { layer ->
        include "${domain}-${layer}"
        project(":${domain}-${layer}").projectDir = file("${domain}/${layer}")
    }
}

commons.each { common ->
    include "common-${common}"
    project(":common-${common}").projectDir = file("common/${common}")
}
