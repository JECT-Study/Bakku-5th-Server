name: "🔧 Chore"
description: 리팩터링, 설정, 의존성, CI/CD, 문서 등 기능 외 작업
title: "🔧 [Chore] "
labels: ["chore"]
body:
  - type: checkboxes
    id: type
    attributes:
      label: 🏷️ 작업 유형
      options:
        - label: ♻️ 리팩터링
        - label: 🔧 설정 · 의존성
        - label: 👷 CI/CD
        - label: 🧪 테스트 보강
        - label: 📝 문서

  - type: textarea
    id: description
    attributes:
      label: 📝 작업 내용
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 💡 필요한 이유

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 작업 목록
      value: |
        - [ ] 
        - [ ] 

  - type: textarea
    id: impact
    attributes:
      label: ⚠️ 영향 범위
      description: 다른 팀원 작업이나 배포에 영향이 있는지 적어주세요.
      placeholder: 예) 의존성 버전 변경으로 로컬 재빌드 필요
